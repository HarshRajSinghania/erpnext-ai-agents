[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-agents"
version = "0.1.0"
description = "Stock assistant for small-business ERP (ERPNext first): watches stock, compares vendors, and asks a person to approve before it creates a draft purchase order"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["erpnext", "frappe", "inventory", "procurement", "reorder", "whatsapp", "telegram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "certifi>=2026.10.19",                      # floor: earlier versions have a known vulnerability (PYSEC-2026-4320, found by pip-audit 25 Oct 2026)
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "apscheduler>=3.10,<4",
    "tzdata; platform_system == 'Windows'",   # zoneinfo needs this on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "bandit>=1.8", "pip-audit>=2.7"]
agents = ["mcp>=2.3,<3", "jsonschema>=4.20"]       # the AI agents and the MCP server (MIT-licensed SDK); everything else works without it

[project.scripts]
erp-agents = "erp_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
erp_agents = ["settings.example.yaml", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
