name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agents]"
      - name: Test
        run: python -m pytest -q

  security-scans:
    name: bandit and pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agents]"
      - name: bandit (any finding fails the build; a justified exception carries a nosec comment that says why)
        run: python -m bandit -r src -q
      - name: pip-audit (known vulnerabilities in the dependencies)
        run: python -m pip_audit --skip-editable

  secrets-and-personal-data:
    name: No secrets or personal data in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          set -u
          if git grep -nIE "(EAA[A-Za-z0-9]{40,}|[0-9]{8,10}:[A-Za-z0-9_-]{35}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" -- . ':!docs/*.md' ; then
            echo "A token or key looks committed. Rotate it and remove it from history."; exit 1
          fi
          if git grep -nIE "(gmail\.com|outlook\.com|yahoo\.com|192\.168\.[0-9]+\.[0-9]+|C:\\Users\\)" -- . ':!LICENSE' ':!tests/test_assistant.py' ':!tests/test_hardening.py' ':!tests/test_agents.py' ; then
            echo "Personal data or a machine address looks committed. Use placeholders."; exit 1
          fi
